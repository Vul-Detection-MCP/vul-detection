name: "vul-detection-db-populator"
services:
  populator:
    image: biggujo/vul-detection-codebadger-db-populator:1.0.3
    volumes:
      - ${PROJECT_METADATA_ABS_DIR}:/app/input/
      - ${PROJECT_TARGET_CODEBADGER_ABS_DIR}:/app/output/
    environment:
      - DB_RELATED_CODEBADGER_CODEBASES_ABSOLUTE_BASE_PATH=${CONTAINER_CODEBADGER_ABS_DIR}${PROJECT_TARGET_JOERN_CODEBASES_DIR}
      - DB_RELATED_CODEBADGER_CPG_ABSOLUTE_BASE_PATH=${CONTAINER_CODEBADGER_ABS_DIR}${PROJECT_TARGET_JOERN_CPG_DIR}
      - DB_RELATED_JOERN_CODEBASES_ABSOLUTE_BASE_PATH=${CONTAINER_JOERN_ABS_DIR}${PROJECT_TARGET_JOERN_CODEBASES_DIR}
      - DB_RELATED_JOERN_CPG_ABSOLUTE_BASE_PATH=${CONTAINER_JOERN_ABS_DIR}${PROJECT_TARGET_JOERN_CPG_DIR}
      - DB_RELATED_JOERN_MIN_PORT=${CONTAINER_MCP_JOERN_MIN_PORT}
      - DB_RELATED_JOERN_MAX_PORT=${CONTAINER_MCP_JOERN_MAX_PORT}
      - CSV_ABSOLUTE_PATH=/app/input/${PROJECT_METADATA_CSV_REPOSITORIES_CLONED_FILE}
      - DB_ABSOLUTE_PATH=/app/output/${PROJECT_TARGET_CODEBADGER_DB_FILE}
