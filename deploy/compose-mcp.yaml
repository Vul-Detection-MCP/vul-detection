name: "vul-detection"
services:
  joern-server:
    image: biggujo/vul-detection-joern:4.0.516
    # Codebadger heavily relies on this name
    container_name: codebadger-joern-server
    volumes:
      # Mount playground for CPG storage (shared with host)
      - ${PROJECT_TARGET_JOERN_ABS_DIR}:/playground/
    restart: unless-stopped
  codebadger-mcp:
    image: biggujo/vul-detection-codebadger:9c01020d89dd4c0f86516044b60c10cd00ce7b0e
    ports:
      - "${CONTAINER_MCP_SERVER_PORT}:4242"
    volumes:
      # Codebadger lookups Joern codebases
      - ${PROJECT_TARGET_JOERN_ABS_DIR}:/app/playground
      # DB persistence
      - ${PROJECT_TARGET_CODEBADGER_ABS_DIR}:/app/input/
      # Application relies on Docker
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - joern-server
    environment:
      MCP_HOST: "0.0.0.0"
      JOERN_SERVER_HOST: "${CONTAINER_MCP_JOERN_SERVER_HOST}"
      DB_ABS_FILE: "/app/input/codebadger.db"
      JOERN_PORT_MIN: ${CONTAINER_MCP_JOERN_MIN_PORT}
      JOERN_PORT_MAX: ${CONTAINER_MCP_JOERN_MAX_PORT}
      QUERY_TIMEOUT: ${CONTAINER_MCP_JOERN_QUERY_TIMEOUT_SECONDS}
      JOERN_JAVA_OPTS: ${CONTAINER_JOERN_JAVA_OPTS}
      JOERN_MEMORY_LIMIT: ${CONTAINER_MCP_JOERN_MEMORY_LIMIT}
